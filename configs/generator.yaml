# 생성기 파라미터
# 근거: docs/생성기_캘리브레이션.md · 구조: docs/생성_데이터_명세.md
# ⚠ assumptions 블록은 실측 근거가 없다. 민감도 분석 대상.

seed: 20260907

# 소스 — FactoryOS 에는 MES · CellOS · ERP · 포지 기록 네 곳에서 데이터가 들어온다(2026-09-08 저녁, 사용자 확정).
# 12곳 전부 네 소스가 온다. 공장 유형(연동/미연동) 구분은 폐기했다.
# 차이는 **보고 품질** 4축이다 — 편향(assumptions) · 성실도(discipline) · 채우는 필드 · 형식(주기·단위·코드).
reporting_profile:
  mes_period_mix: { daily: 0.6, shift: 0.25, weekly: 0.15 }   # MES 집계 주기. shift = 하루 2회, weekly = 7일
  qty_unit_lot_share: 0.3          # 수량을 로트 단위로 찍는 공장 비율 (생산 수량이 로트 배수로 내림된다)
  lot_sizes: [25, 50, 100]
  local_defect_code_share: 0.4     # 자체 불량코드 체계를 쓰는 공장 비율. FactoryOS 가 표준 코드로 정규화한다
  field_availability:              # 선택 필드를 채우는 공장 비율. 필수 필드(생산·폐기·재작업 / 자재)는 전부 온다
    mes: { inspected_qty: 0.75, defect_type: 0.7, machine_id: 0.6 }
    erp: { overtime_hours: 0.7, headcount: 0.7, wip_qty: 0.6, outsourcing: 0.65 }
  erp_discipline_range: [0.6, 0.98]   # ERP 일 마감 성실도. 회계라 MES 보다 높다

scale:
  factories: 12            # 제품군 4종 x 3곳 (= a+b+c)
  products: 4
  months: 36               # 36개월. 한 공장이 한 번에 한 오더만 돌므로(09-08 저녁 전제) 오더 수는 기간 ÷ (리드 + 간격) ≈ 300건
  order_gap_days: [0, 5]   # 이전 오더 약속 납기 → 다음 발주까지
  # MES/Cell/ERP 는 API 로 온다. 사람이 채우는 주간 보고가 아니다.
  mes_interval_days: 1     # 기본 집계 주기(일). 공장별 실제 주기는 reporting_profile.mes_period_mix
  fai_per_order: 1         # 오더당 1회. 고객 요구사항이라 유형과 무관하게 제출된다

order:
  qty_lognormal_median: 800     # CNC 수요의 49%가 5,000개 미만 배치
  qty_lognormal_sigma: 0.9
  qty_min: 200
  qty_max: 5000
  # 납기는 여유율에서 유도한다(orders.py 주석 참조). lead_time_weeks 는
  # 결과가 상식 범위에 있는지 보는 검증용 범위이지 입력이 아니다.
  lead_slack_mean: 0.20
  lead_slack_sd: 0.30
  lead_time_weeks_sanity: [2.5, 10]
  market_mix: { us_west: 0.4, us_east: 0.3, eu: 0.3 }

market_transit_days:            # 라벨 지연을 정한다
  us_west: 18
  us_east: 30
  eu: 60                        # ⚠ 유럽은 두 달. "2~6주"가 아니다

aql:
  major: 0.025
  minor: 0.040
  critical: 0.0
  inspection_level: "II"        # ISO 2859-1 표본 크기 표

quality:
  internal_defect_rate_median: 0.030   # 3~4시그마 실태
  escape_formula: "internal * (1 - detection_rate)"
  detection_rate_range: [0.88, 0.998]   # escape 목표에서 역산

# ⚠ 실측 근거 없음 — 민감도 분석 필수
assumptions:
  factory_capability_sd: 1.0           # log escape. 상하위 약 10배 격차
  product_difficulty_sd: 0.5
  within_factory_ar1: 0.3
  # ── 주관적 공장 차이: 2026-09-10 **통제**(사용자 지시) ────────────────────────
  # 공장 간 차이는 **물리적인 것만** 남긴다 — 무엇을 만드는가(product_difficulty_sd) ·
  # 제조 능력(factory_capability_sd) · 검출 능력(detection_rate_range) · 공정 드리프트(within_factory_ar1).
  # 사람 습관에서 오는 차이(보고 편향 · 보고 노이즈 · 보고 성실도 · FAI 제출률)는 통제한다.
  # 설명 가능성 때문만이 아니다 — 8 seed 실측에서 그것들을 빼면 유출 2단 +0.787 → +0.823 로 **오른다.**
  # CellOS/FactoryOS 를 설치시켜 자동 수집하는 목적이 바로 그 주관성 제거다.
  # 합성 데이터이므로 편향을 없애고 모델링한다. CTO 질문 29 의 답(「보고는 전부 맞는다」)과
  # 세계를 일치시키는 것이다. 예측은 잃는 게 없다 — 8 seed 실측 유출 2단 +0.787 → +0.787.
  # 2단 모델의 κ 가 편향을 공장별 상수로 흡수하므로 애초에 예측에 안 걸려 있었다.
  # 덤으로 눈금이 맞는다(b 진실 1.000 · 추정 1.000, 통제 전에는 12.7% 과소).
  # ⚠ 대가 — 편향 심한 공장이 0곳이 되어 **불일치 탐지 측정이 정의되지 않는다**(기저 0%).
  #    그 상품을 다시 재려면 아래 「현실 값」으로 되돌린다.
  #      현실 값: report_bias_mean 0.5 · report_bias_sd 0.25 · bias_sensitivity 0.5
  #               mes_input_bias_range [0.55, 1.0]
  report_bias_mean: 1.0                # 1.0 = 실제대로 보고
  report_bias_sd: 0.0
  bias_sensitivity: 0.0                # 나쁠수록 더 축소 보고 — 통제로 껐다
  # 보고의 들쭉날쭉함(편향과 별개). 대충 센 것 · 사람마다 다른 기준 · 형식적으로 채운 숫자.
  # ⚠ 2단 모델 성능이 이 값에 가장 크게 의존한다. 편향보다 이쪽이 훨씬 아프다 —
  # 편향 통제는 유출 2단을 하나도 안 바꿨고(+0.787 → +0.787) 이 값이 0.45 → 0 일 때 +0.824 다.
  # 2026-09-10 통제 — 현실 값은 0.45.
  report_noise_cv: 0.0
  # 나쁜 공장이 더 숨기는가. 음수 = 나쁠수록 축소 보고가 심하다. 0 = 독립.
  # 2026-09-10 판정 완료(민감도 8번째 축) — 0 → -0.85 에서 예측·불일치 어느 쪽도 안 흔들린다.
  # 편향을 통제한 지금은 무효한 손잡이다(편향 sd 가 0 이라 상관이 걸릴 곳이 없다).
  bias_capability_corr: 0.0
  # 보고 성실도(결측·지연·공란). 공장별 차이지만 물리가 아니라 사람 습관이다.
  # 2026-09-10 통제 — 현실 값은 [0.3, 0.95]. ⚠ L0M 피처 6개(l0m_*)가 상수가 되어 죽는다.
  report_discipline_range: [0.95, 0.95]
  # MES 입력 단계의 편향. 폐기·재작업 판정은 사람이 하므로 남는다.
  # 다만 보고서를 꾸미는 것보다 어렵다 — MES 에 안 찍으면 재고가 안 맞는다.
  # 2026-09-10 통제 — 현실 값은 [0.55, 1.0].
  mes_input_bias_range: [1.0, 1.0]
  # 2026-09-10 통제 — 현실 값은 0.85(고객 요구사항이라 높다).
  fai_submit_rate: 1.0
  # 유출 불량의 심각도 구성. **실측 근거 없음** — 다만 로트 불합격률을
  # 실무 범위(1~10%)로 만드는 것은 critical 비중이지 major AQL 이 아니다.
  defect_severity_mix: { critical: 0.25, major: 0.50, minor: 0.25 }

telemetry:
  # a·b 유형에 설치돼 있다. masters.py 가 factory_types 에서 유도한다.
  cell_sample_interval_min: 60
